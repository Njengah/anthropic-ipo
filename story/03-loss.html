<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 03 — The loss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee;
    --ink: #1c1915;
    --muted: #5e574e;
    --faint: #8a8176;
    --coral: #d4532e;
    --sage: #2f7a45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; height: 100%; }
  .frame {
    width: min(1440px, 100%);
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 36px 56px 28px;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  .mark {
    font-family: Newsreader, Georgia, serif;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.03em;
  }
  .mark span { color: var(--coral); }
  .kicker {
    margin: 0;
    color: var(--faint);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .stage {
    display: grid;
    grid-template-columns: minmax(280px, 420px) 1fr;
    gap: 48px;
    align-items: center;
    min-height: 0;
  }
  .hero {
    font-family: Newsreader, Georgia, serif;
    font-weight: 550;
    font-size: clamp(64px, 7.2vw, 112px);
    letter-spacing: -0.045em;
    line-height: 0.88;
    margin: 0;
    font-variant-numeric: tabular-nums;
    transition: color 0.25s ease;
  }
  .hero em {
    font-style: normal;
    font-size: 0.32em;
    letter-spacing: -0.03em;
    color: var(--muted);
    margin-left: 8px;
  }
  .when { margin: 16px 0 0; font-size: 20px; font-weight: 500; }
  .facts { margin: 16px 0 0; padding: 0; list-style: none; }
  .facts li { color: var(--muted); font-size: 15.5px; line-height: 1.5; padding: 2px 0; }
  .facts li strong { color: var(--ink); font-weight: 500; }
  .bridge {
    position: relative;
    height: min(52vh, 440px);
    cursor: crosshair;
    touch-action: none;
  }
  .zero {
    position: absolute;
    left: 0;
    right: 0;
    top: 18%;
    height: 1px;
    background: #d9d1c6;
  }
  .cols {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .col { position: relative; height: 100%; }
  .bar {
    position: absolute;
    left: 50%;
    width: min(72px, 70%);
    transform: translateX(-50%);
    border-radius: 8px;
    opacity: 0.38;
    transition: opacity 0.25s ease, transform 0.25s ease, height 0.7s cubic-bezier(.2,.8,.2,1);
  }
  .col.on .bar { opacity: 1; transform: translateX(-50%) scaleX(1.08); }
  .bar.up {
    bottom: 82%;
    background: var(--sage);
    border-radius: 8px 8px 3px 3px;
    box-shadow: none;
  }
  .col.on .bar.up { box-shadow: 0 12px 26px rgba(47, 122, 69, 0.22); }
  .bar.down {
    top: 18%;
    background: var(--coral);
    border-radius: 3px 3px 8px 8px;
  }
  .col.on .bar.down { box-shadow: 0 16px 30px rgba(212, 83, 46, 0.2); }
  .lab {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    text-align: center;
    font-size: 13px;
    color: var(--faint);
  }
  .col.on .lab { color: var(--ink); font-weight: 500; }
  .guide {
    position: absolute;
    top: 0;
    bottom: 28px;
    width: 1.5px;
    background: var(--coral);
    opacity: 0;
    pointer-events: none;
  }
  .guide.show { opacity: 0.85; }
  footer {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    color: var(--faint);
    font-size: 12px;
  }
  @media (max-width: 900px) {
    html, body { overflow: auto; }
    .frame { height: auto; min-height: 100%; padding: 24px 20px; }
    .stage { grid-template-columns: 1fr; }
    .hero { font-size: 68px; }
    .bridge { height: 360px; }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">03 · The loss</p>
  </header>
  <div class="stage">
    <div>
      <p class="hero" id="hero" style="color:#2f7a45">+1.0<em>billion</em></p>
      <p class="when" id="when">Operating profit</p>
      <ul class="facts" id="facts"></ul>
    </div>
    <div class="bridge" id="bridge">
      <div class="zero"></div>
      <div class="guide" id="guide"></div>
      <div class="cols" id="cols"></div>
    </div>
  </div>
  <footer>
    <span>Sweep the bridge. Same quarter, Q2 2026. Billions.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const steps = [
  {
    name: "Operating profit",
    value: 0.974,
    sign: 1,
    label: "Profit",
    lines: [
      "First GAAP operating profit",
      "Adjusted operating profit was <strong>$2.2 billion</strong>, a 19% margin",
      "The adjusted figure adds back stock pay"
    ]
  },
  {
    name: "Interest income",
    value: 0.762,
    sign: 1,
    label: "Interest",
    lines: [
      "Earned on the cash pile",
      "Cash and short-term investments were <strong>$131.7 billion</strong>",
      "The loss did not empty the bank"
    ]
  },
  {
    name: "Fair-value mark",
    value: 59.597,
    sign: -1,
    label: "Fair-value mark",
    lines: [
      "Convertible notes marked higher after the private valuation rose",
      "This is <strong>not cash</strong> spent on compute",
      "The largest number in the quarter"
    ]
  },
  {
    name: "Other",
    value: 8.448,
    sign: -1,
    label: "Other",
    lines: [
      "Mostly note-purchase agreements booked that quarter",
      "A real charge, still much smaller than the mark",
      "Sits below the zero line with the mark"
    ]
  },
  {
    name: "GAAP net loss",
    value: 66.309,
    sign: -1,
    label: "Net loss",
    lines: [
      "<strong>+1.0 + 0.8 − 59.6 − 8.4</strong>",
      "Had the offering closed on June 30, <strong>$2.9 billion</strong> of stock pay would have been booked that day",
      "That stock pay is not inside this loss"
    ]
  }
];

const max = 66.309;
const cols = document.getElementById("cols");
const bridge = document.getElementById("bridge");
const guide = document.getElementById("guide");
const hero = document.getElementById("hero");
const when = document.getElementById("when");
const facts = document.getElementById("facts");
let active = -1;
let playing = true;
let playFrom = 0;

steps.forEach((step) => {
  const col = document.createElement("div");
  col.className = "col";
  const down = step.sign < 0;
  const room = down ? 0.74 : 0.16;
  const h = Math.max(8, (step.value / max) * room * 100);
  col.innerHTML = `<div class="bar ${down ? "down" : "up"}" style="height:${h}%"></div><div class="lab">${step.label}</div>`;
  cols.appendChild(col);
});

function paint(i) {
  const step = steps[i];
  const positive = step.sign > 0;
  hero.style.color = positive ? "#2f7a45" : "#d4532e";
  hero.innerHTML = `${positive ? "+" : "−"}${step.value.toFixed(1)}<em>billion</em>`;
  when.textContent = step.name;
  facts.innerHTML = step.lines.map((line) => `<li>${line}</li>`).join("");
  [...cols.children].forEach((col, n) => col.classList.toggle("on", n === i));
}

function select(i) {
  if (i === active) return;
  active = i;
  paint(i);
}

function indexFromEvent(ev) {
  const rect = bridge.getBoundingClientRect();
  const x = Math.max(0, Math.min(rect.width - 1, ev.clientX - rect.left));
  guide.style.left = `${x}px`;
  guide.classList.add("show");
  return Math.min(steps.length - 1, Math.floor((x / rect.width) * steps.length));
}

bridge.addEventListener("pointermove", (ev) => {
  playing = false;
  select(indexFromEvent(ev));
});
bridge.addEventListener("pointerleave", () => {
  guide.classList.remove("show");
});

function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 3000);
  const eased = 1 - Math.pow(1 - t, 3);
  const x = eased * bridge.clientWidth;
  guide.style.left = `${x}px`;
  guide.classList.add("show");
  select(Math.min(steps.length - 1, Math.floor(eased * steps.length)));
  if (t < 1) requestAnimationFrame(intro);
  else guide.classList.remove("show");
}

select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
