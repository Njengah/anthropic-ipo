<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 07 — The share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee; --ink:#1c1915; --muted:#5e574e; --faint:#8a8176; --coral:#d4532e; --line:#e4ddd3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .frame { width:min(1440px,100%); height:100%; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; padding:32px 56px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .mark { font-family:Newsreader, Georgia, serif; font-size:22px; margin:0; letter-spacing:-0.03em; }
  .mark span { color:var(--coral); }
  .kicker { margin:0; color:var(--faint); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; }
  .stage { display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:36px; align-items:center; }
  .hero { font-family:Newsreader, Georgia, serif; font-weight:550; font-size:clamp(52px,5.6vw,84px); letter-spacing:-0.04em; line-height:0.92; margin:0; }
  .when { margin:12px 0 0; font-size:18px; font-weight:500; }
  .facts { margin:14px 0 0; padding:0; list-style:none; }
  .facts li { color:var(--muted); font-size:15.5px; line-height:1.45; padding:2px 0; }
  .facts li strong { color:var(--ink); font-weight:500; }
  table { width:100%; border-collapse:collapse; cursor:crosshair; }
  th { text-align:left; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); font-weight:500; padding:0 12px 10px; }
  td { padding:16px 12px; border-top:1px solid var(--line); font-size:15px; vertical-align:top; transition:background .2s ease; }
  tr.on td { background:#fff; }
  tr.ipo.on td { background:#fde8e0; }
  td:first-child { font-weight:500; }
  footer { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; }
  @media (max-width:900px) { html,body { overflow:auto; } .frame { height:auto; min-height:100%; padding:24px 18px; } .stage { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">07 · The share</p>
  </header>
  <div class="stage">
    <div>
      <p class="hero" id="hero">Class A</p>
      <p class="when" id="when">The share that lists</p>
      <ul class="facts" id="facts"></ul>
    </div>
    <table id="table">
      <thead><tr><th>Share</th><th>Cash</th><th>Vote</th><th>Board</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <footer>
    <span>Sweep the rows. The price is blank. This part is already written.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const rows = [
  { name:"Class A", ipo:true, when:"The share that lists", cash:"Yes", vote:"1 per share", board:"Not the majority", lines:["You get the economics.","You elect the directors the trust does not.","A <strong>10-for-1</strong> split of Class A and Class N already happened, on September 17, 2026."] },
  { name:"Class N", ipo:false, when:"Partners", cash:"Yes", vote:"None", board:"Converts if sold outside", lines:["No vote, except where the law requires.","It converts to Class A if sold to an outsider.","A benefit fund already holds Class N equal to <strong>5%</strong> of the company. The board can issue up to another <strong>2%</strong> each time the price rises 50%."] },
  { name:"Class F", ipo:false, when:"Seven founders", cash:"None", vote:"50.1%", board:"The ordinary vote", lines:["One share, held by the founders’ company.","<strong>50.1%</strong> of the general vote.","No economics. The vote elects the directors the trust does not."] },
  { name:"Class T", ipo:false, when:"The trust", cash:"None", vote:"Not on ordinary matters", board:"Elects the majority", lines:["The Long-Term Benefit Trust holds it.","Those directors are a <strong>majority of the board</strong>.","No economics."] },
  { name:"Class E", ipo:false, when:"Employees", cash:"None", vote:"A narrow set", board:"Not the board", lines:["For employees other than the co-founders.","A vote on a few matters only.","No economics."] }
];
const body = document.querySelector("#table tbody");
const hero = document.getElementById("hero");
const when = document.getElementById("when");
const facts = document.getElementById("facts");
const table = document.getElementById("table");
let active = -1, playing = true, playFrom = 0;
rows.forEach((row) => {
  const tr = document.createElement("tr");
  if (row.ipo) tr.classList.add("ipo");
  tr.innerHTML = `<td>${row.name}</td><td>${row.cash}</td><td>${row.vote}</td><td>${row.board}</td>`;
  body.appendChild(tr);
});
function paint(i) {
  const row = rows[i];
  hero.textContent = row.name;
  when.textContent = row.when;
  facts.innerHTML = row.lines.map((line) => `<li>${line}</li>`).join("");
  [...body.children].forEach((tr, n) => tr.classList.toggle("on", n === i));
}
function select(i) { if (i === active) return; active = i; paint(i); }
table.addEventListener("pointermove", (ev) => {
  playing = false;
  const rowsEl = [...body.children];
  for (let i = 0; i < rowsEl.length; i++) if (ev.clientY <= rowsEl[i].getBoundingClientRect().bottom) { select(i); return; }
  select(rowsEl.length - 1);
});
function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 3600);
  select(Math.min(rows.length - 1, Math.floor((1 - Math.pow(1 - t, 3)) * rows.length)));
  if (t < 1) requestAnimationFrame(intro);
}
select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
