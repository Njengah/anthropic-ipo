<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 07 — Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee; --ink:#1c1915; --muted:#5e574e; --faint:#8a8176; --coral:#d4532e; --line:#e4ddd3; --sage:#2f7a45; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .frame { width:min(1440px,100%); height:100%; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; padding:32px 56px 24px; gap:8px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .mark { font-family:Newsreader, Georgia, serif; font-size:22px; margin:0; letter-spacing:-0.03em; }
  .mark span { color:var(--coral); }
  .kicker { margin:0; color:var(--faint); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; }
  .stage { display:grid; grid-template-columns:minmax(260px,360px) 1fr; gap:28px; align-items:center; min-height:0; }
  .hero { font-family:Newsreader, Georgia, serif; font-weight:550; font-size:clamp(52px,5.4vw,80px); letter-spacing:-0.04em; line-height:0.92; margin:0; }
  .when { margin:12px 0 0; font-size:18px; font-weight:500; }
  .facts { margin:14px 0 0; padding:0; list-style:none; }
  .facts li { color:var(--muted); font-size:15px; line-height:1.45; padding:3px 0; }
  .facts li strong { color:var(--ink); font-weight:500; }
  table { width:100%; border-collapse:collapse; cursor:crosshair; }
  th { text-align:left; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--faint); font-weight:500; padding:0 10px 10px; white-space:nowrap; }
  td { padding:16px 10px; border-top:1px solid var(--line); font-size:15px; transition:background .2s ease; white-space:nowrap; }
  td:first-child { font-weight:500; }
  td.own { color:var(--coral); font-weight:500; }
  tr.on td { background:#fff; }
  tr.on td.own { background:#fde8e0; }
  footer { display:flex; justify-content:space-between; gap:24px; color:var(--faint); font-size:12px; }
  @media (max-width:900px) {
    html, body { overflow:auto; }
    .frame { height:auto; min-height:100%; padding:24px 18px; }
    .stage { grid-template-columns:1fr; }
    .hero { font-size:56px; }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">Competition</p>
  </header>
  <div class="stage">
    <div>
      <p class="hero" id="hero">Google</p>
      <p class="when" id="when">Investor and competitor</p>
      <ul class="facts" id="facts"></ul>
    </div>
    <table id="table">
      <thead>
        <tr><th>Company</th><th>Stake</th><th>Compute</th><th>Sells Claude</th><th>Own models</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <footer>
    <span>Sweep the rows. S-1, risk factors and Business — Competition.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const rows = [
  {
    name: "Google",
    stake: "Above 5%",
    compute: "$114.5B",
    channel: "GCP",
    own: "Yes",
    when: "Investor and competitor",
    lines: [
      "Significant equity. After the notes convert, Google holds <strong>more than 5%</strong>. The exact stake is blank. A note facility caps ownership at <strong>14.99%</strong>.",
      "Compute commitment of at least <strong>$114.5 billion</strong>, April 2026 through July 2033.",
      "Claude is sold on Google Cloud, and Google is paid a fee. Google also develops and deploys its own models on that cloud.",
      "The filing names <strong>Google and OpenAI</strong> as the primary competitors."
    ]
  },
  {
    name: "Amazon",
    stake: "Above 5%",
    compute: "$110B",
    channel: "AWS",
    own: "Yes",
    when: "Investor and competitor",
    lines: [
      "Significant equity. Amazon notes outstanding: <strong>$6.2 billion</strong>. After conversion, Amazon holds <strong>more than 5%</strong>. The exact stake is blank.",
      "Compute commitment of at least <strong>$110 billion</strong>, May 2026 through April 2036.",
      "Claude is sold on AWS. Amazon also develops and deploys competing models through that cloud.",
      "Amazon is a customer of Claude at the same time."
    ]
  },
  {
    name: "Microsoft",
    stake: "Equity",
    compute: "$44.9B",
    channel: "Azure",
    own: "Yes",
    when: "Investor and competitor",
    lines: [
      "The filing says Microsoft has made a <strong>significant equity investment</strong>. It does not give Microsoft’s percentage.",
      "Compute commitment of at least <strong>$44.9 billion</strong>, November 2026 through May 2033.",
      "Claude is sold on Azure. Microsoft develops and deploys competing models through that cloud.",
      "These three clouds can see Anthropic’s <strong>pricing and commercial terms</strong>, and its operations and compute needs."
    ]
  },
  {
    name: "OpenAI",
    stake: "—",
    compute: "—",
    channel: "—",
    own: "Named",
    when: "The other named competitor",
    lines: [
      "Named with Google as a <strong>primary competitor</strong>.",
      "Competes for customers, talent, compute, and partnerships.",
      "The filing says these competitors have more money, their own compute, a longer history, and a stronger brand.",
      "No compute contract and no stake in Anthropic are described for OpenAI."
    ]
  },
  {
    name: "Open-weight",
    stake: "—",
    compute: "—",
    channel: "—",
    own: "Category",
    when: "No company is named",
    lines: [
      "A further set of open-weight and open-source models, from <strong>state actors</strong> and from research organizations.",
      "The filing says they compete on cost, where buyers will take a cheaper model.",
      "It says that can put <strong>pricing pressure</strong> on Claude for some uses.",
      "No individual lab is named in that passage."
    ]
  }
];

const body = document.querySelector("#table tbody");
const hero = document.getElementById("hero");
const when = document.getElementById("when");
const facts = document.getElementById("facts");
const table = document.getElementById("table");
let active = -1;
let playing = true;
let playFrom = 0;

rows.forEach((row) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${row.name}</td><td>${row.stake}</td><td>${row.compute}</td><td>${row.channel}</td><td class="own">${row.own}</td>`;
  body.appendChild(tr);
});

function paint(i) {
  const row = rows[i];
  hero.textContent = row.name;
  when.textContent = row.when;
  facts.innerHTML = row.lines.map((line) => `<li>${line}</li>`).join("");
  [...body.children].forEach((tr, n) => tr.classList.toggle("on", n === i));
}

function select(i) {
  if (i === active) return;
  active = i;
  paint(i);
}

table.addEventListener("pointermove", (ev) => {
  playing = false;
  const list = [...body.children];
  for (let i = 0; i < list.length; i++) {
    if (ev.clientY <= list[i].getBoundingClientRect().bottom) {
      select(i);
      return;
    }
  }
  select(list.length - 1);
});

function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 4200);
  const eased = 1 - Math.pow(1 - t, 3);
  if (t < 0.78) select(Math.min(rows.length - 1, Math.floor((eased / 0.78) * rows.length)));
  else select(0);
  if (t < 1) requestAnimationFrame(intro);
}

select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
