<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 08 — Read the number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee; --ink:#1c1915; --muted:#5e574e; --faint:#8a8176; --coral:#d4532e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .frame { width:min(1440px,100%); height:100%; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; padding:32px 56px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .mark { font-family:Newsreader, Georgia, serif; font-size:22px; margin:0; letter-spacing:-0.03em; }
  .mark span { color:var(--coral); }
  .kicker { margin:0; color:var(--faint); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; }
  .cards { height:100%; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:stretch; padding:24px 0 8px; cursor:crosshair; }
  .card { background:#fff; border-radius:16px; padding:22px 20px; display:flex; flex-direction:column; opacity:0.45; transform:translateY(0); transition:opacity .2s ease, transform .2s ease; }
  .card.on { opacity:1; transform:translateY(-8px); }
  .card h2 { margin:0; font-size:15px; font-weight:500; }
  .num { font-family:Newsreader, Georgia, serif; font-size:clamp(42px,4.6vw,68px); letter-spacing:-0.04em; line-height:1; margin:16px 0; color:var(--coral); }
  .def { margin:0; color:var(--muted); font-size:14.5px; line-height:1.45; }
  .def strong { color:var(--ink); font-weight:500; }
  footer { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; }
  @media (max-width:980px) { html,body { overflow:auto; } .frame { height:auto; min-height:100%; padding:24px 18px; } .cards { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">08 · Read the number</p>
  </header>
  <div class="cards" id="cards"></div>
  <footer>
    <span>Sweep the cards. The sentence under the number is the point.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const cards = [
  { title:"Net revenue retention", num:"~900%", def:"As of September 30, 2026. It counts customers who spent at least <strong>$1</strong> a year earlier. Claude Pro and Max are left out." },
  { title:"Adjusted operating margin", num:"19%", def:"Q2 2026. GAAP operating margin was <strong>8%</strong>. The 19% adds back stock pay, <strong>$1.3 billion</strong> that quarter." },
  { title:"Code written by Claude", num:">90%", def:"Of September 2026 contributions to their own codebase. The filing never says what a contribution is. Code volume per engineer was also <strong>over 45 times</strong> the 2024 rate." },
  { title:"Usage that broke the rules", num:"5–7%", def:"Of revenue for the nine months ended September 30, from customers later judged to be breaking the rules. Enforcement stepped up in <strong>August and September 2026</strong>." }
];
const host = document.getElementById("cards");
let active = -1, playing = true, playFrom = 0;
cards.forEach((card) => {
  const el = document.createElement("article");
  el.className = "card";
  el.innerHTML = `<h2>${card.title}</h2><div class="num">${card.num}</div><p class="def">${card.def}</p>`;
  host.appendChild(el);
});
function select(i) {
  if (i === active) return;
  active = i;
  [...host.children].forEach((el, n) => el.classList.toggle("on", n === i));
}
host.addEventListener("pointermove", (ev) => {
  playing = false;
  const items = [...host.children];
  for (let i = 0; i < items.length; i++) if (ev.clientX <= items[i].getBoundingClientRect().right) { select(i); return; }
  select(items.length - 1);
});
function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 3200);
  select(Math.min(cards.length - 1, Math.floor((1 - Math.pow(1 - t, 3)) * cards.length)));
  if (t < 1) requestAnimationFrame(intro);
}
select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
