<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 06 — If you build on Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee; --ink:#1c1915; --muted:#5e574e; --faint:#8a8176; --coral:#d4532e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .frame { width:min(1440px,100%); height:100%; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; padding:32px 56px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .mark { font-family:Newsreader, Georgia, serif; font-size:22px; margin:0; letter-spacing:-0.03em; }
  .mark span { color:var(--coral); }
  .kicker { margin:0; color:var(--faint); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; }
  .stage { display:grid; grid-template-columns:minmax(280px,460px) 1fr; gap:40px; align-items:center; }
  .hero { font-family:Newsreader, Georgia, serif; font-weight:550; font-size:clamp(64px,7vw,112px); letter-spacing:-0.045em; line-height:0.88; margin:0; color:var(--coral); }
  .hero em { font-style:normal; font-size:0.32em; color:var(--muted); margin-left:8px; }
  .when { margin:14px 0 0; font-size:20px; font-weight:500; }
  .facts { margin:14px 0 0; padding:0; list-style:none; }
  .facts li { color:var(--muted); font-size:15.5px; line-height:1.45; padding:2px 0; }
  .facts li strong { color:var(--ink); font-weight:500; }
  .list { cursor:crosshair; touch-action:none; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:14px 16px; border-radius:12px; background:transparent; opacity:0.4; transition:opacity .2s ease, background .2s ease, transform .2s ease; }
  .row.on { opacity:1; background:#fff; transform:translateX(6px); }
  .who { font-weight:500; }
  .stat { font-family:Newsreader, Georgia, serif; font-size:28px; letter-spacing:-0.03em; }
  footer { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; }
  @media (max-width:900px) { html,body { overflow:auto; } .frame { height:auto; min-height:100%; padding:24px 18px; } .stage { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">06 · If you build on Claude</p>
  </header>
  <div class="stage">
    <div>
      <p class="hero" id="hero">&gt;80<em>%</em></p>
      <p class="when" id="when">Models younger than six months</p>
      <ul class="facts" id="facts"></ul>
    </div>
    <div class="list" id="list"></div>
  </div>
  <footer>
    <span>Sweep the rows. Quarter ended September 30, 2026, unless a row says otherwise.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const rows = [
  { hero:">&gt;80", unit:"%", when:"Models younger than six months", stat:">80%", lines:["Models released in the prior six months were <strong>over 80%</strong> of that quarter’s revenue.","The dollar amount for the quarter is still blank.","What you integrated is already the old model."] },
  { hero:"−40", unit:"%", when:"Cost per task", stat:"−40%", lines:["Claude Opus 5.5 versus Opus 5.","About <strong>40% cheaper</strong> per task for the customer.","Cheaper tasks are how they sell more usage."] },
  { hero:"More", unit:"", when:"Agents versus chat", stat:"More", lines:["Multi-step agents burn far more compute per task than chat.","The filing says this can grow <strong>cost faster than revenue</strong>.","If you are building agents, you are the expensive workload."] },
  { hero:"50", unit:"%", when:"Platform and a first-party app", stat:"50%", lines:["Over half of $100k customers used both in the September quarter.","About <strong>30%</strong> did in the December 2025 quarter.","Cowork, out since January, has been adopted faster than Claude Code was at the same age."] },
  { hero:"Off", unit:"", when:"Fable 5 and Mythos 5", stat:"Off", lines:["In June 2026 the U.S. Commerce Department export-restricted both.","Anthropic <strong>turned them off for everyone</strong> until the restrictions were lifted.","A model you depend on can be switched off."] },
  { hero:"30", unit:"targets", when:"Claude Code", stat:"~30", lines:["September 2025. A state-sponsored group used Claude Code.","About <strong>30</strong> targets, including companies and government agencies.","A limited number of intrusions worked."] }
];
const list = document.getElementById("list");
const hero = document.getElementById("hero");
const when = document.getElementById("when");
const facts = document.getElementById("facts");
let active = -1, playing = true, playFrom = 0;
rows.forEach((row) => {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<div class="who">${row.when}</div><div class="stat">${row.stat}</div>`;
  list.appendChild(el);
});
function paint(i) {
  const row = rows[i];
  hero.innerHTML = `${row.hero}${row.unit ? `<em>${row.unit}</em>` : ""}`;
  when.textContent = row.when;
  facts.innerHTML = row.lines.map((line) => `<li>${line}</li>`).join("");
  [...list.children].forEach((el, n) => el.classList.toggle("on", n === i));
}
function select(i) { if (i === active) return; active = i; paint(i); }
function indexFromEvent(ev) {
  const items = [...list.children];
  for (let i = 0; i < items.length; i++) if (ev.clientY <= items[i].getBoundingClientRect().bottom + 4) return i;
  return items.length - 1;
}
list.addEventListener("pointermove", (ev) => { playing = false; select(indexFromEvent(ev)); });
function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 4200);
  select(Math.min(rows.length - 1, Math.floor((1 - Math.pow(1 - t, 3)) * rows.length)));
  if (t < 1) requestAnimationFrame(intro);
}
select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
