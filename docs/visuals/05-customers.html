<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 05 — Customers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee; --ink:#1c1915; --muted:#5e574e; --faint:#8a8176; --coral:#d4532e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .frame { width:min(1440px,100%); height:100%; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; padding:32px 56px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .mark { font-family:Newsreader, Georgia, serif; font-size:22px; margin:0; letter-spacing:-0.03em; }
  .mark span { color:var(--coral); }
  .kicker { margin:0; color:var(--faint); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; }
  .stage { display:grid; grid-template-columns:minmax(280px,440px) 1fr; gap:48px; align-items:center; }
  .hero { font-family:Newsreader, Georgia, serif; font-weight:550; font-size:clamp(56px,6.4vw,96px); letter-spacing:-0.04em; line-height:0.9; margin:0; }
  .when { margin:14px 0 0; font-size:20px; font-weight:500; }
  .facts { margin:14px 0 0; padding:0; list-style:none; }
  .facts li { color:var(--muted); font-size:15.5px; line-height:1.45; padding:2px 0; }
  .facts li strong { color:var(--ink); font-weight:500; }
  .list { cursor:crosshair; touch-action:none; display:flex; flex-direction:column; gap:10px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:12px 14px; border-radius:12px; opacity:0.42; transition:opacity .2s ease, background .2s ease; }
  .row.on { opacity:1; background:#fff; }
  .who { font-size:16px; font-weight:500; }
  .meta { color:var(--faint); font-size:13px; }
  .split { margin-top:22px; }
  .bar { display:flex; height:36px; border-radius:8px; overflow:hidden; }
  .bar span { display:block; height:100%; transition:opacity .25s ease; }
  .cap { display:flex; justify-content:space-between; margin-top:8px; color:var(--faint); font-size:12px; }
  footer { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; }
  @media (max-width:900px) { html,body { overflow:auto; } .frame { height:auto; min-height:100%; padding:24px 18px; } .stage { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">05 · Customers</p>
  </header>
  <div class="stage">
    <div>
      <p class="hero" id="hero">40 million</p>
      <p class="when" id="when">Under $100k</p>
      <ul class="facts" id="facts"></ul>
    </div>
    <div>
      <div class="list" id="list"></div>
      <div class="split">
        <div class="bar" id="bar">
          <span data-part="pay" style="width:74%;background:#d4532e"></span>
          <span data-part="rest" style="width:26%;background:#d8d0c4"></span>
        </div>
        <div class="cap"><span>74% · $100k and up, first half</span><span>26% · everyone else</span></div>
      </div>
    </div>
  </div>
  <footer>
    <span>Sweep the ladder. Counts are September 30. The 74% is the first half, when that group was still about 6,000.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const rows = [
  { hero:"40 million", when:"Under $100k", part:"rest", who:"The crowd", meta:"Sep 30", lines:["About <strong>40 million</strong> customers.","Trailing twelve months ended September 30, 2026.","Each one under $100,000."] },
  { hero:"11,900", when:"$100k or more", part:"pay", who:"The count", meta:"Sep 30", lines:["More than <strong>11,900</strong> customers.","As of September 30, 2026.","This is a headcount, not the revenue share."] },
  { hero:"74%", when:"Of first-half revenue", part:"pay", who:"The money", meta:"Jan–Jun", lines:["<strong>$12.0 billion</strong> of $16.3 billion.","First half of 2026.","At June 30 the $100k group was more than <strong>6,000</strong>, not yet 11,900."] },
  { hero:"1,900", when:"$1 million or more", part:"pay", who:"Further up", meta:"Sep 30", lines:["More than <strong>1,900</strong> customers.","Inside the same ladder.","As of September 30, 2026."] },
  { hero:"250", when:"$10 million or more", part:"pay", who:"The top of the ladder", meta:"Sep 30", lines:["About <strong>250</strong> customers.","No single customer was more than <strong>10%</strong> of revenue.","The top five were about <strong>25%</strong> for the nine months ended September 30."] },
  { hero:"0.1%", when:"Of their expenses", part:"pay", who:"Fortune 500", meta:"Sep quarter", lines:["More than half the Fortune 500 are $100k customers.","Revenue from them averaged <strong>under 0.1%</strong> of their expenses.","The logos are in. The budgets are not."] }
];
const list = document.getElementById("list");
const hero = document.getElementById("hero");
const when = document.getElementById("when");
const facts = document.getElementById("facts");
const parts = [...document.querySelectorAll("#bar span")];
let active = -1, playing = true, playFrom = 0;
rows.forEach((row) => {
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<div><div class="who">${row.who}</div><div class="meta">${row.meta}</div></div><div class="who">${row.hero}</div>`;
  list.appendChild(el);
});
function paint(i) {
  const row = rows[i];
  hero.textContent = row.hero;
  when.textContent = row.when;
  facts.innerHTML = row.lines.map((line) => `<li>${line}</li>`).join("");
  [...list.children].forEach((el, n) => el.classList.toggle("on", n === i));
  parts.forEach((part) => { part.style.opacity = part.dataset.part === row.part ? "1" : "0.35"; });
}
function select(i) { if (i === active) return; active = i; paint(i); }
function indexFromEvent(ev) {
  const items = [...list.children];
  for (let i = 0; i < items.length; i++) if (ev.clientY <= items[i].getBoundingClientRect().bottom + 4) return i;
  return items.length - 1;
}
list.addEventListener("pointermove", (ev) => { playing = false; select(indexFromEvent(ev)); });
function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 4200);
  select(Math.min(rows.length - 1, Math.floor((1 - Math.pow(1 - t, 3)) * rows.length)));
  if (t < 1) requestAnimationFrame(intro);
}
select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
