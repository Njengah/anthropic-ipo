<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story 09 — Still blank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,450;6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f4ee; --ink:#1c1915; --muted:#5e574e; --faint:#8a8176; --coral:#d4532e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .frame { width:min(1440px,100%); height:100%; margin:0 auto; display:grid; grid-template-rows:auto 1fr auto; padding:32px 56px 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  .mark { font-family:Newsreader, Georgia, serif; font-size:22px; margin:0; letter-spacing:-0.03em; }
  .mark span { color:var(--coral); }
  .kicker { margin:0; color:var(--faint); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; }
  .grid { height:100%; display:grid; grid-template-columns:1fr 1fr; gap:16px; align-content:center; cursor:crosshair; }
  .blank { min-height:180px; border:1.5px dashed #c9bfb2; border-radius:18px; padding:22px 24px; background:transparent; transition:background .2s ease, border-color .2s ease, transform .2s ease; }
  .blank.on { background:#fff; border-color:#d4532e; transform:translateY(-4px); }
  .empty { font-family:Newsreader, Georgia, serif; font-style:italic; font-size:42px; color:#b7ad9f; letter-spacing:-0.03em; }
  .blank.on .empty { color:var(--coral); }
  h2 { margin:10px 0 6px; font-size:18px; font-weight:500; }
  p { margin:0; color:var(--muted); font-size:15px; line-height:1.45; }
  footer { display:flex; justify-content:space-between; color:var(--faint); font-size:12px; }
  @media (max-width:800px) { html,body { overflow:auto; } .frame { height:auto; min-height:100%; padding:24px 18px; } .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="frame">
  <header>
    <p class="mark">ANT<span>.</span></p>
    <p class="kicker">09 · Still blank</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <span>Sweep the boxes. These fill in when the amendment arrives. The vote does not.</span>
    <span>Not an offer.</span>
  </footer>
</div>
<script>
const boxes = [
  { empty:"$ —", title:"IPO price", text:"The range on the cover is empty." },
  { empty:"— shares", title:"Shares offered", text:"Company shares and selling-stockholder shares are both unstated." },
  { empty:"$ —", title:"Q3 2026 revenue", text:"The summary leaves the dollar amount blank. The quarterly table stops at June 30." },
  { empty:"$ —", title:"Commitment total", text:"The “more than” figure, and how much is due within a year, are blank." }
];
const grid = document.getElementById("grid");
let active = -1, playing = true, playFrom = 0;
boxes.forEach((box) => {
  const el = document.createElement("article");
  el.className = "blank";
  el.innerHTML = `<div class="empty">${box.empty}</div><h2>${box.title}</h2><p>${box.text}</p>`;
  grid.appendChild(el);
});
function select(i) {
  if (i === active) return;
  active = i;
  [...grid.children].forEach((el, n) => el.classList.toggle("on", n === i));
}
function indexFromEvent(ev) {
  const items = [...grid.children];
  const x = ev.clientX, y = ev.clientY;
  for (let i = 0; i < items.length; i++) {
    const r = items[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
  }
  let best = 0, dist = Infinity;
  items.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
    if (d < dist) { dist = d; best = i; }
  });
  return best;
}
grid.addEventListener("pointermove", (ev) => { playing = false; select(indexFromEvent(ev)); });
function intro(now) {
  if (!playing) return;
  if (!playFrom) playFrom = now;
  const t = Math.min(1, (now - playFrom) / 3200);
  select(Math.min(boxes.length - 1, Math.floor((1 - Math.pow(1 - t, 3)) * boxes.length)));
  if (t < 1) requestAnimationFrame(intro);
}
select(0);
requestAnimationFrame(intro);
</script>
</body>
</html>
