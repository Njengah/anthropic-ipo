<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthropic IPO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,550&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ee;
    --ink: #1c1915;
    --muted: #5e574e;
    --faint: #8a8176;
    --line: #e4ddd3;
    --coral: #d4532e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: Outfit, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 212px 1fr; height: 100%; }
  aside {
    position: relative;
    height: 100%;
    padding: 28px 18px 24px 0;
    border-right: 1px solid var(--line);
    background: #f3efe8;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .mark {
    font-family: Newsreader, Georgia, serif;
    font-size: 26px;
    letter-spacing: -0.03em;
    margin: 0 0 22px 28px;
  }
  .mark span { color: var(--coral); }
  .rail {
    position: absolute;
    left: 27px;
    top: 78px;
    bottom: 22px;
    width: 1px;
    background: #ddd4c8;
  }
  nav {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: auto;
    padding-left: 27px;
  }
  nav a {
    position: relative;
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    align-items: baseline;
    margin-left: -1px;
    padding: 9px 12px 9px 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    border-left: 2px solid transparent;
  }
  nav a .n {
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  nav a.on {
    color: var(--ink);
    font-weight: 500;
    background: linear-gradient(90deg, rgba(212, 83, 46, 0.08), transparent 80%);
    border-left-color: var(--coral);
  }
  nav a.on .n { color: var(--coral); }
  .stage { min-width: 0; min-height: 0; background: var(--bg); }
  iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 0 10px; }
    .mark { margin: 0 0 8px 18px; font-size: 22px; }
    .rail { display: none; }
    nav { flex-direction: row; overflow: auto; padding: 0 8px 0 12px; gap: 0; }
    nav a { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; padding: 8px 12px; }
    nav a.on { border-bottom-color: var(--coral); border-left-color: transparent; background: transparent; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <p class="mark">ANT<span>.</span></p>
    <div class="rail"></div>
    <nav id="nav"></nav>
  </aside>
  <div class="stage">
    <iframe id="frame" title="Anthropic IPO"></iframe>
  </div>
</div>
<script>
const views = [
  ["01", "Revenue", "01-revenue.html"],
  ["02", "Dollar", "02-dollar.html"],
  ["03", "Loss", "03-loss.html"],
  ["04", "Promises", "04-promises.html"],
  ["05", "Customers", "05-customers.html"],
  ["06", "Builders", "06-builders.html"],
  ["07", "Share", "07-control.html"],
  ["08", "Competition", "07-competition.html"],
  ["09", "Numbers", "08-numbers.html"],
  ["10", "Blanks", "09-blanks.html"]
];
const nav = document.getElementById("nav");
const frame = document.getElementById("frame");
views.forEach(([n, name, file], i) => {
  const a = document.createElement("a");
  a.href = "#" + name.toLowerCase();
  a.dataset.i = String(i);
  a.innerHTML = `<span class="n">${n}</span><span>${name}</span>`;
  nav.appendChild(a);
});
function show(i) {
  const item = views[Math.max(0, Math.min(views.length - 1, i))];
  frame.src = "visuals/" + item[2];
  [...nav.children].forEach((a, n) => a.classList.toggle("on", n === i));
  const hash = "#" + item[1].toLowerCase();
  if (location.hash !== hash) history.replaceState(null, "", hash);
}
function indexFromHash() {
  const name = location.hash.slice(1);
  const i = views.findIndex((item) => item[1].toLowerCase() === name);
  return i < 0 ? 0 : i;
}
nav.addEventListener("click", (ev) => {
  const a = ev.target.closest("a");
  if (!a) return;
  ev.preventDefault();
  show(Number(a.dataset.i));
});
window.addEventListener("keydown", (ev) => {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  ev.preventDefault();
  const current = [...nav.children].findIndex((a) => a.classList.contains("on"));
  show(current + (ev.key === "ArrowDown" ? 1 : -1));
});
window.addEventListener("hashchange", () => show(indexFromHash()));
show(indexFromHash());
</script>
</body>
</html>
